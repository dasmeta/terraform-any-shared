apiVersion: v1
kind: Secret
metadata:
  name: {{ required "A target Secret name is required" .Values.targetSecret.name | quote }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/name: defectdojo-retention-bootstrap
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
# Omit data/stringData: the Job owns live token data, not Helm/Terraform.
