# values for base chart http-echo app, routed through Gateway API
image:
  repository: mendhak/http-https-echo
  tag: "34"

containerPort: 8080

service:
  enabled: true
  type: ClusterIP

podAnnotations:
  sidecar.istio.io/inject: "true"
# Disable traditional Ingress and use Gateway API instead
ingress:
  enabled: false

gatewayApi:
  enabled: true
  httpRoutes:
    - name: http-echo-route
      parentRefs:
        - name: main
          sectionName: http-80-default
      hostnames:
        - http-echo-custom-chart-and-image-overrides.localhost
      rules:
        # Rule 1: Return 403 for /admin and /forbidden paths (automatically creates AuthorizationPolicy)
        - matches:
            - path:
                value: /admin
                type: PathPrefix
            - path:
                value: /forbidden
                type: PathPrefix
          directResponse:
            status: 403
        # Rule 2: Route all other traffic to the service
        - matches:
            - path:
                value: /
                type: PathPrefix
