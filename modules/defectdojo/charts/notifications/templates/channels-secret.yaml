{{- if and .Values.enabled .Values.createChannelsSecret }}
{{- if or (ne .Values.channelsSecret.slackKey "slack-url") (ne .Values.channelsSecret.teamsKey "teams-url") (ne .Values.channelsSecret.opsgenieKey "opsgenie-key") }}
{{- fail "Direct channels require the default channel Secret keys" }}
{{- end }}
{{- $data := .Values.channelsData }}
{{- if not (or (index $data "slack-url") (index $data "teams-url") (index $data "opsgenie-key")) }}
{{- fail "Direct channels require at least one destination" }}
{{- end }}
{{- range $key := list "slack-url" "teams-url" "opsgenie-key" }}
{{- if and (index $data $key) (empty (index $data $key | b64dec | trim)) }}
{{- fail "Supplied direct channel credentials must not be whitespace-only" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ required "Channels Secret name is required" .Values.channelsSecret.name | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: defectdojo-notifications
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
data:
  {{- range $key := list "slack-url" "teams-url" "opsgenie-key" }}
  {{- if index $data $key }}
  {{ $key }}: {{ index $data $key | quote }}
  {{- end }}
  {{- end }}
{{- end }}
