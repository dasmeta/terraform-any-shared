{{- if .Values.enabled }}
{{- $secret := required "A credentials Secret is required" .Values.credentialsSecret }}
{{- $worker := required "The notification worker release is required" .Values.workerRelease }}
{{- $database := required "A database name is required" .Values.database }}
{{- if not (regexMatch "^[A-Za-z0-9_]{1,64}$" $database) }}{{ fail "Invalid database name" }}{{ end }}
{{- if ne .Values.username "notifier" }}{{ fail "Managed username must be notifier" }}{{ end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: defectdojo-notifications-mysql
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: defectdojo-notifications-mysql
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: defectdojo-notifications-mysql
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  serviceName: {{ .Release.Name }}
  # Kubernetes retains StatefulSet PVCs on scale-down and deletion by default.
  # Omit the feature-gated retention policy field for Kubernetes 1.27 compatibility.
  selector:
    matchLabels:
      app.kubernetes.io/name: defectdojo-notifications-mysql
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: defectdojo-notifications-mysql
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/content: {{ .Values.contentChecksum | quote }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mysql
          image: {{ required "A MySQL image is required" .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - mysqld
            - --datadir=/var/lib/mysql/data
            - --socket=/var/run/mysqld/mysqld.sock
            - --pid-file=/var/run/mysqld/mysqld.pid
            - --require-secure-transport=ON
            - --ssl-ca=/run/mysql-secrets/ca.crt
            - --ssl-cert=/run/mysql-secrets/tls.crt
            - --ssl-key=/run/mysql-secrets/tls.key
            - --tls-version=TLSv1.2,TLSv1.3
            - --skip-name-resolve
            - --log-error=/var/run/mysqld/mysql-error.log
            - --secure-file-priv=NULL
            - --mysqlx=OFF
          env:
            - name: MYSQL_DATABASE
              value: {{ $database | quote }}
            - name: MYSQL_USER
              value: notifier
            - name: MYSQL_ROOT_HOST
              value: localhost
            - name: MYSQL_PASSWORD_FILE
              value: /run/mysql-secrets/password
            - name: MYSQL_ROOT_PASSWORD_FILE
              value: /run/mysql-secrets/root-password
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            exec:
              command: ["mysqladmin", "--protocol=socket", "--socket=/var/run/mysqld/mysqld.sock", "ping", "--silent"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ["mysqladmin", "--protocol=socket", "--socket=/var/run/mysqld/mysqld.sock", "ping", "--silent"]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - bash
                - -ec
                - 'MYSQL_PWD="$(cat /run/mysql-secrets/password)" mysql --protocol=tcp --host=127.0.0.1 --ssl-mode=VERIFY_CA --ssl-ca=/run/mysql-secrets/ca.crt --user="$MYSQL_USER" --database="$MYSQL_DATABASE" --execute="SELECT 1" > /dev/null'
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: credentials
              mountPath: /run/mysql-secrets
              readOnly: true
            - name: runtime
              mountPath: /var/run/mysqld
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: credentials
          secret:
            secretName: {{ $secret | quote }}
            defaultMode: 0440
        - name: runtime
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if ne .Values.persistence.storageClass nil }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ required "A persistent disk size is required" .Values.persistence.size | quote }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: defectdojo-notifications-mysql
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: defectdojo-notifications
              app.kubernetes.io/instance: {{ $worker | quote }}
      ports:
        - protocol: TCP
          port: 3306
{{- end }}
