apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: defectdojo-retention
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  schedule: {{ .Values.schedule | quote }}
  timeZone: {{ .Values.timeZone | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 2100
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: defectdojo-retention
            app.kubernetes.io/instance: {{ .Release.Name }}
          annotations:
            checksum/content: {{ .Values.contentChecksum | quote }}
            checksum/worker: {{ .Files.Get "files/retention.py" | sha256sum | quote }}
            checksum/policy: {{ toJson .Values.policy | sha256sum | quote }}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: retention
              image: {{ .Values.image | quote }}
              imagePullPolicy: IfNotPresent
              command: ["python", "-B", "/config/retention.py"]
              env:
                - name: RETENTION_POLICY_FILE
                  value: /config/policy.json
                - name: RETENTION_TOKEN_FILE
                  value: /var/run/secrets/defectdojo/token
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: token
                  mountPath: /var/run/secrets/defectdojo
                  readOnly: true
          volumes:
            - name: config
              configMap:
                name: {{ .Release.Name }}
            - name: token
              secret:
                secretName: {{ required "Existing API token Secret name is required" .Values.apiTokenSecret.name }}
                defaultMode: 0440
                items:
                  - key: {{ .Values.apiTokenSecret.key | quote }}
                    path: token
