name: DefectDojo Python Tests

on:
  pull_request:
    paths:
      - "modules/defectdojo/**"
      - ".github/workflows/defectdojo-python-tests.yaml"
  push:
    branches: [main, master]
    paths:
      - "modules/defectdojo/**"
      - ".github/workflows/defectdojo-python-tests.yaml"

permissions:
  contents: read

concurrency:
  group: defectdojo-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: modules/defectdojo
    # This database and password exist only for the isolated CI job.
    services:
      mysql:
        image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
        env:
          MYSQL_DATABASE: notifier_test
          MYSQL_ROOT_PASSWORD: notifier-test-root
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pnotifier-test-root --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      TF_IN_AUTOMATION: "1"
      NOTIFIER_MYSQL_TEST_CONFIG: '{"host":"127.0.0.1","port":3306,"database":"notifier_test","username":"root","password":"notifier-test-root","tls":false}'
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.14.7"
          terraform_wrapper: false
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: "v3.19.0"
      - name: Install manifest and certificate test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ruby openssl
      - name: Install test dependencies
        run: |
          python -m pip install --no-index --find-links notifier/vendor -r notifier/requirements.txt
          python -m pip install -r tests/requirements.txt
      - name: Initialize Terraform for offline plan tests
        run: terraform init -backend=false -input=false
      - name: Run Python tests with the SQL fixture
        run: python -m pytest -q tests --junitxml="$RUNNER_TEMP/defectdojo-tests.xml"
      - name: Require all tests to run
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report = ET.parse(Path(os.environ["RUNNER_TEMP"]) / "defectdojo-tests.xml")
          skipped = report.findall(".//skipped")
          if skipped:
              raise SystemExit(f"Unexpected skipped tests: {len(skipped)}; check Terraform/tools/SQL setup")
          PY
